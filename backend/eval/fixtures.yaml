    measures: [downtime]
    dimensions: [{field: region}]
    filters: [{field: reading_date, op: last_n_days, value: 30}]

# -- questions that must be refused ------------------------------------

- id: unverified_entity
  question: how many interventions were completed in 2026?
  tags: [refusal, confidence-gate]
  expect: refused
  because: well_interventions carries an unverified status field

- id: intervention_gain
  question: net gain by intervention type
  tags: [refusal, confidence-gate]
  expect: refused
  because: same entity, still gated

- id: no_such_measure
  question: what was our revenue last quarter?
  tags: [refusal, out-of-layer]
  expect: refused
  because: revenue is not modelled anywhere in the layer

- id: cohort_analysis
  question: show me a cohort retention curve for wells by spud year
  tags: [refusal, out-of-grammar]
  expect: refused
  because: cohort analysis is outside the grammar entirely

- id: ratio_across_grains
  question: oil this month as a percentage of last month
  tags: [refusal, out-of-grammar]
  expect: refused
  # Still a refusal after the grammar grew, and for a sharper reason than
  # before. period_change_pct is (current - previous) / previous; this asks
  # for current / previous, which differs by exactly 100 points. `ratio`
  # takes a measure as its denominator, not a transformed measure, so the
  # question has no expression -- and answering it with period_change_pct
  # would be wrong by a whole turn.
  because: a ratio to the previous period is not the same as the percent
           change, and only the latter is expressible

- id: three_dimensions
  question: oil by month, region and well type
  # Was a refusal until the cap moved from two to three. Kept under its
  # original id so the change is visible in history rather than looking
  # like a fixture that was always there.
  tags: [three-dim, facet]
  expected:
    entity: production
    measures: [oil]
    dimensions: [{field: reading_date, grain: month}, {field: region},
                 {field: well_type}]

# -- relative dates -------------------------------------------------------
# The year is substituted at load, because a fixture asserting a literal
# year is correct until January and then fails on the calendar rather than
# on a regression. These cover the phrasings where the *model* has to pick
# a year: the existing last_n_days fixtures never do, which is how "oil
# last year" could resolve to 2023 with the suite entirely green.

- id: oil_last_year
  question: oil production last year
  tags: [relative-date, filter]
  expected:
    entity: production
    measures: [oil]
    filters: [{field: reading_date, op: in_year, value: "{{last_year}}"}]

- id: gas_this_year_by_month
  question: gas production by month so far this year
  tags: [relative-date, date-grain]
  expected:
    entity: production
    measures: [gas]
    dimensions: [{field: reading_date, grain: month}]
    filters: [{field: reading_date, op: in_year, value: "{{this_year}}"}]

- id: oil_by_month_last_90
  question: oil by month over the last 90 days
  tags: [relative-date, date-grain]
  expected:
    entity: production
    measures: [oil]
    dimensions: [{field: reading_date, grain: month}]
    filters: [{field: reading_date, op: last_n_days, value: 90}]

- id: downtime_by_region_last_year
  question: downtime by region last year
  tags: [relative-date, nominal]
  expected:
    entity: production
    measures: [downtime]
    dimensions: [{field: region}]
    filters: [{field: reading_date, op: in_year, value: "{{last_year}}"}]
