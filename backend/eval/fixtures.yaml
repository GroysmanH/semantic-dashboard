# 30 held-out questions with their expected semantic query.
#
# Written before any prompt tuning, deliberately: fixtures written
# afterwards measure the tuning rather than the design.
#
# `expect: refused` marks questions the system SHOULD decline. A harness
# that only scores successes overstates what has been built -- roughly a
# sixth of these are unanswerable on purpose.

- id: oil_by_month
  question: oil production by month
  tags: [date-grain]
  expected:
    entity: production
    measures: [oil]
    dimensions: [{field: reading_date, grain: month}]

- id: oil_by_region
  question: total oil by region
  tags: [nominal]
  expected:
    entity: production
    measures: [oil]
    dimensions: [{field: region}]

- id: oil_2026
  question: how much oil did we produce in 2026?
  tags: [filter, no-dimension]
  expected:
    entity: production
    measures: [oil]
    filters: [{field: reading_date, op: in_year, value: 2026}]

- id: gas_by_quarter
  question: gas production by quarter
  tags: [date-grain]
  expected:
    entity: production
    measures: [gas]
    dimensions: [{field: reading_date, grain: quarter}]

- id: downtime_by_region
  question: which regions had the most downtime?
  tags: [nominal, ordering]
  expected:
    entity: production
    measures: [downtime]
    dimensions: [{field: region}]
    order_by: [{field: downtime, dir: desc}]

- id: oil_by_month_and_region
  question: oil by month broken down by region
  tags: [two-dim]
  expected:
    entity: production
    measures: [oil]
    dimensions: [{field: reading_date, grain: month}, {field: region}]

- id: crude_synonym
  question: crude output by field
  tags: [synonym]
  expected:
    entity: production
    measures: [oil]
    dimensions: [{field: field_name}]

- id: npt_synonym
  question: npt by well type
  tags: [synonym]
  expected:
    entity: production
    measures: [downtime]
    dimensions: [{field: well_type}]

- id: oil_and_gas
  question: oil and gas by month
  tags: [multi-measure]
  expected:
    entity: production
    measures: [oil, gas]
    dimensions: [{field: reading_date, grain: month}]

- id: water_last_90
  question: water produced in the last 90 days
  tags: [relative-date]
  expected:
    entity: production
    measures: [water]
    filters: [{field: reading_date, op: last_n_days, value: 90}]

- id: avg_oil_by_region
  question: average daily oil per well by region
  tags: [aggregation]
  expected:
    entity: production
    measures: [avg_oil]
    dimensions: [{field: region}]

- id: oil_by_year
  question: yearly oil production
  tags: [date-grain]
  expected:
    entity: production
    measures: [oil]
    dimensions: [{field: reading_date, grain: year}]

- id: oil_atyrau
  question: oil production in Atyrau
  tags: [filter]
  expected:
    entity: production
    measures: [oil]
    filters: [{field: region, op: "=", value: Atyrau}]

- id: oil_two_regions
  question: combined total oil across Atyrau and Aktobe, not split by region
  tags: [filter, in-op]
  expected:
    entity: production
    measures: [oil]
    filters: [{field: region, op: in, value: [Atyrau, Aktobe]}]

- id: oil_by_field_top
  question: top 5 fields by oil production
  tags: [ordering, limit]
  expected:
    entity: production
    measures: [oil]
    dimensions: [{field: field_name}]
    order_by: [{field: oil, dir: desc}]
